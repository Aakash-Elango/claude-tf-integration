name: 'Terraform Plan, Audit & Self-Heal'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write        # Required to commit auto-fixes back to PR
  pull-requests: write   # Required to post audit reports to PR comments

env:
  ARM_CLIENT_ID: "${{ secrets.AZURE_CLIENT_ID }}"
  ARM_CLIENT_SECRET: "${{ secrets.AZURE_CLIENT_SECRET }}"
  ARM_SUBSCRIPTION_ID: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
  ARM_TENANT_ID: "${{ secrets.AZURE_TENANT_ID }}"
  ARM_USE_OIDC: false

jobs:
  terraform-plan:
    name: 'Terraform Plan & Security Audit'
    runs-on: ubuntu-latest
    outputs:
      plan-exitcode: ${{ steps.tf-plan.outputs.exitcode }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (for Claude CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check > fmt_err.log 2>&1

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color > validate_err.log 2>&1

      - name: Terraform Plan
        id: tf-plan
        run: |
          export exitcode=0
          terraform plan -detailed-exitcode -out=tfplan > plan_err.log 2>&1 || export exitcode=$?
          echo "exitcode=$exitcode" >> $GITHUB_OUTPUT
          if [ $exitcode -eq 1 ]; then
            echo "Terraform plan failed!"
            exit 1
          fi

      - name: Render Text Plan
        if: steps.tf-plan.outputs.exitcode == '0' || steps.tf-plan.outputs.exitcode == '2'
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Claude AI Security Audit
        id: claude-audit
        if: steps.tf-plan.outputs.exitcode == '0' || steps.tf-plan.outputs.exitcode == '2'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          PLAN_TEXT=$(cat tfplan.txt)
          
          AUDIT_RESULT=$(claude -p "
          You are a Senior Cloud DevOps Security Auditor inspecting a Terraform Plan for Azure.
          Evaluate the following Terraform Plan against repository policies in CLAUDE.md and Azure security best practices.

          Evaluation Criteria:
          1. Detect open ingress rules (e.g., 0.0.0.0/0 on SSH/22 or RDP/3389).
          2. Verify storage account encryption and TLS requirements.
          3. Validate Azure naming conventions.

          Output Format:
          - Provide a structured Markdown summary of findings.
          - Conclude with 'STATUS: FAIL' if critical security violations exist.
          - Conclude with 'STATUS: PASS' if the plan is compliant.

          Terraform Plan Output:
          \`\`\`text
          $PLAN_TEXT
          \`\`\`
          ")

          echo "$AUDIT_RESULT" > audit_report.md
          cat audit_report.md

          if grep -q "STATUS: FAIL" audit_report.md; then
            echo "audit_passed=false" >> $GITHUB_OUTPUT
            echo "Security Audit Failed!" > audit_err.log
            cat audit_report.md >> audit_err.log
            exit 1
          else
            echo "audit_passed=true" >> $GITHUB_OUTPUT
          fi

      - name: Comment Audit Results on Pull Request
        if: always() && github.event_name == 'pull_request' && (steps.tf-plan.outputs.exitcode == '0' || steps.tf-plan.outputs.exitcode == '2')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('audit_report.md')) return;
            const report = fs.readFileSync('audit_report.md', 'utf8');
            const passed = "${{ steps.claude-audit.outputs.audit_passed }}" === "true";
            
            const title = passed 
              ? "### 🟢 Claude Security Audit: PASSED" 
              : "### 🔴 Claude Security Audit: FAILED";

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${title}\n\n${report}`
            });

      # =========================================================================
      # CLAUDE SELF-HEAL STEP (Runs on syntax, validation, plan, or audit failure)
      # =========================================================================
      - name: Claude Auto-Fix & Remediation
        if: failure() && github.event_name == 'pull_request'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "### Pipeline failure detected. Triggering Claude Auto-Fix..."
          
          # Consolidate all potential log files
          touch fmt_err.log validate_err.log plan_err.log audit_err.log
          ERROR_LOGS=$(cat fmt_err.log validate_err.log plan_err.log audit_err.log)

          # Execute Claude CLI to fix .tf files directly in the workspace
          claude -p "
          You are an automated Azure Terraform Engineer.
          The Terraform pipeline failed during execution. Below are the error logs and policy violations caught by the runner:

          \`\`\`text
          $ERROR_LOGS
          \`\`\`

          Instructions:
          1. Analyze the error logs and locate the invalid HCL syntax, missing arguments, or security policy violations in the .tf files.
          2. Edit the relevant .tf files in this repository to resolve the issues completely.
          3. Ensure your fixes conform to policies defined in CLAUDE.md.
          "

          # Configure bot identity
          git config user.name "claude-bot[bot]"
          git config user.email "claude-bot@users.noreply.github.com"

          # Stage, commit, and push changes back to the PR branch
          git add *.tf
          if ! git diff --cached --quiet; then
            git commit -m "fix(terraform): auto-remediate pipeline failure via Claude"
            git push origin HEAD:${{ github.head_ref }}
            echo "Auto-fix successfully committed and pushed to PR branch."
          else
            echo "No file changes made by Claude."
          fi

      - name: Upload Terraform Plan
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan

  terraform-apply:
    name: 'Terraform Apply'
    # Runs only on the main branch
    if: github.ref == 'refs/heads/main'
    needs: [terraform-plan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan